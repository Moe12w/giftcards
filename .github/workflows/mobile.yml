name: mobile

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - run: npm ci

      # The root Vitest config also discovers web/lib and web/app tests. Those
      # import Next.js and web-only packages, so web's dependencies must be
      # installed here too (web.yml installs them separately in its own job).
      - run: npm ci --prefix web

      - name: Lint (Expo / React Native)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
