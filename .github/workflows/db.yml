name: db

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  money-path:
    runs-on: ubuntu-latest

    # Production is Postgres 17. A plain server plus tests/db/supabase-bootstrap.sql
    # stands in for the roles, auth/storage schemas and grants Supabase supplies.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      # The service container speaks plain TCP, not TLS.
      TEST_DATABASE_SSL: disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Apply the Supabase stand-ins and every migration
        run: node tests/db/apply-migrations.mjs

      - name: Money-path tests
        run: npm run test:db
